[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engine"
version = "0.1.0"
description = "Truthful, self-healing context intelligence engine for the PokeSlider repository"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PokeSlider Maintainers" }]
license = { text = "MIT" }

dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7",
  "jinja2>=3.1,<4",
  "watchdog>=4.0,<6",
  "libcst>=1.4,<2",
  "networkx>=3.3,<4",
  "GitPython>=3.1.43,<4",
  "PyYAML>=6.0.1,<7",
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
context-engine = "context_engine.cli.main:app"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["context_engine*"]

[tool.setuptools.package-data]
"context_engine" = ["templates/*.j2", "templates/**/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
