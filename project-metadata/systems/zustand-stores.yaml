id: zustand-stores
name: Zustand stores
purpose: >-
  Client UI state — overlay navigation, discovery UI, compare slots, dex
  lists, team builder, and battle simulator. Never duplicates Query cache.
layer: state
used_by:
  - carousel
  - overlay
  - discovery
  - compare
  - team_builder
  - battle_sim
evidence:
  source_files:
    - path: src/store/uiStore.ts
    - path: src/store/comparisonStore.ts
    - path: src/store/dexListsStore.ts
    - path: src/store/teamBuilderStore.ts
    - path: src/store/battleSimulatorStore.ts
    - path: src/features/discovery/discoveryUiStore.ts
  confidence: verified
do_not:
  - Store server-fetched payloads inside a Zustand store.
